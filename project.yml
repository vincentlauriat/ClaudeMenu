name: ClaudeMenu
options:
  bundleIdPrefix: fr.vincentlauriat
  deploymentTarget:
    macOS: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

# Explicit scheme (xcodegen does not generate one otherwise).
schemes:
  ClaudeMenu:
    build:
      targets:
        ClaudeMenu: all
    run:
      config: Debug

targets:
  ClaudeMenu:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    dependencies:
      - package: Sparkle
    sources:
      - path: ClaudeMenu
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: ClaudeMenu
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.claudemenu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: ClaudeMenu/ClaudeMenu.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: ClaudeMenu/Info.plist
      properties:
        CFBundleName: ClaudeMenu
        CFBundleDisplayName: ClaudeMenu
        CFBundleIdentifier: fr.vincentlauriat.claudemenu
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # Sparkle 2 auto-update. SUPublicEDKey is the public half of the EdDSA key
        # held in the login keychain under the account "ClaudeMenu". Never change it
        # and never regenerate the key: every installed copy would reject all future
        # updates. The private half is backed up outside this repo.
        SUFeedURL: "https://raw.githubusercontent.com/vincentlauriat/ClaudeMenu/main/appcast.xml"
        SUPublicEDKey: "YKJW/w5ffEn2VZ9A60ntS2MSZYW8FwhqXrToBz/RUDM="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
